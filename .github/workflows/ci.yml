name: CI - microservices

# Runs when any microservice (or this workflow) changes. Every service in
# the matrix below is rebuilt on each such push - simple to reason about
# for now, at the cost of rebuilding services that didn't actually change.
on:
  push:
    paths:
      - "microservices/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "microservices/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel the other services just because one of them failed -
      # we want to see every service's result, not just the first failure.
      fail-fast: false
      matrix:
        service:
          - analytics-service
          - api-composer
          - api-gateway
          - notifications-service
          - projects-service
          - tasks-service
          - users-service
          - workflow-service

    # Run every step inside the service's own module directory,
    # since each microservice has its own go.mod/go.sum.
    defaults:
      run:
        working-directory: microservices/${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: microservices/${{ matrix.service }}/go.mod
          cache: true
          cache-dependency-path: microservices/${{ matrix.service }}/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only push on an actual push to main, not on pull requests - PRs (which
      # could come from a fork) get build-validated but never touch the
      # registry credentials.
      - name: Log in to Azure Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: microservices/${{ matrix.service }}
          file: microservices/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service }}:latest
          # Per-service cache scope so the 8 parallel matrix jobs don't
          # trample each other's GitHub Actions cache entries.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
